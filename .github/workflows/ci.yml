name: CI

# What runs is picked from the files a pull request changes, or a push to main changes since the
# previous main commit (tooling/ci-scope.mjs, docs/operations.md "What CI runs"): lint, unit
# tests and build for the changed packages and their dependents, and the integration lanes only
# when a backend package is among them. A version bump alone (the release PR) runs the
# release-please check. The `full-ci` label, a manual run and the weekly scheduled run run
# everything; the weekly run catches what a scope rule may have missed.
#
# Job names never change with the scope. A job out of scope is skipped and starts no runner (a
# skipped job counts as passing for a required check); the integration lanes are three named
# jobs rather than a matrix for that reason (see below). Every job after the scope runs and
# fails when the scope job failed, so a broken scope cannot skip its way to green.
#
# Adding any label starts a new run (only `full-ci` widens it): skipping the run for other
# labels would report the checks as skipped, which reads as passing over an earlier failure.

on:
  pull_request:
    # `labeled`: adding `full-ci` starts the full run straight away.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  # Everything, once a week (Monday 03:17 UTC), as main no longer runs everything on each push.
  schedule:
    - cron: '17 3 * * 1'

# A newer push (or label) to the same pull request replaces the run in progress. Pushes to
# main are grouped by commit, so none of them is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      any: ${{ steps.scope.outputs.any }}
      filters: ${{ steps.scope.outputs.filters }}
      server: ${{ steps.scope.outputs.server }}
      integration: ${{ steps.scope.outputs.integration }}
      server_guards: ${{ steps.scope.outputs.server_guards }}
      server_guard_files: ${{ steps.scope.outputs.server_guard_files }}
      grafana: ${{ steps.scope.outputs.grafana }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff is against the merge base with the target branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pick the scope
        id: scope
        env:
          FULL: >-
            ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
            || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # A pull request diffs against its merge base; a push to main against the main commit
          # before it (the PR's checks ran on the same change).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$FULL" = "true" ]; then
            node tooling/ci-scope.mjs --full
          else
            node tooling/ci-scope.mjs --base "$BASE" --head HEAD
          fi
      # The scope script's own guard: milliseconds, no install.
      - run: node --test tooling/ci-scope.test.mjs

  lint-test:
    name: Lint, unit tests, build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      FILTERS: ${{ needs.changes.outputs.filters }}
    steps:
      - if: needs.changes.result != 'success'
        run: echo "::error::The CI scope job did not succeed, so nothing here can be trusted to pass." && exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Real decoders for apps/server/test/unit/audio/decode.test.ts, which fails
      # (rather than skips) under CI when they are missing.
      # Cached as .deb files per runner image: a hit installs them with dpkg and never reaches the
      # package mirror (a stalled mirror once held this step for 16 minutes before failing).
      # Nothing to do when the image already has them. Saved straight after the install, so a
      # job that fails later still keeps them; a set dpkg refuses falls back to apt-get.
      - if: needs.changes.outputs.server == 'true'
        id: apt
        run: |
          if dpkg -s mpg123 sndfile-programs >/dev/null 2>&1; then echo "installed=true" >> "$GITHUB_OUTPUT"; fi
          echo "key=apt-audio-$ImageOS-$ImageVersion-v1" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.server == 'true' && steps.apt.outputs.installed != 'true'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}
      - if: needs.changes.outputs.server == 'true' && steps.apt.outputs.installed != 'true'
        timeout-minutes: 5
        run: |
          DEBS="$HOME/apt-debs"; PKGS="mpg123 sndfile-programs"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != 'true' ]; then
            sudo mkdir -p "$DEBS/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$DEBS" $PKGS
            # apt's root-only lock would stop the cache from saving the directory.
            sudo rm -rf "$DEBS/partial" "$DEBS/lock" && sudo chown -R "$(id -u):$(id -g)" "$DEBS"
          fi
          sudo dpkg -i "$DEBS"/*.deb || { sudo apt-get update && sudo apt-get install -y --fix-broken --no-install-recommends $PKGS; }
      - if: needs.changes.outputs.server == 'true' && steps.apt.outputs.installed != 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}
      - run: pnpm install --frozen-lockfile
      # Each package's lint keeps its incremental type-check state in node_modules/.cache/tsc
      # (tsc compares file contents, not times, so a restored state is safe on a fresh checkout):
      # an unchanged package checks in seconds. Restored after the install, so pnpm never finds
      # files it did not put in node_modules. Saved per commit; the newest one is restored.
      - if: needs.changes.outputs.any == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/*/node_modules/.cache/tsc
            packages/*/node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-
      # lint = tsc --noEmit over src AND test in every package in scope (tests are typechecked).
      - if: needs.changes.outputs.any == 'true'
        id: lint
        run: pnpm --workspace-concurrency=4 $FILTERS run lint
      # Saved right after lint, failed or not (the state records the errors too), so a job that
      # fails later still keeps it.
      - if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            apps/*/node_modules/.cache/tsc
            packages/*/node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
      - if: needs.changes.outputs.any == 'true'
        run: pnpm --workspace-concurrency=4 $FILTERS run test
      # The server tests that read the web UIs, docker/ and the whole repository (docs/
      # included), when the server's own suite is not in scope.
      - name: Server repository guards
        if: needs.changes.outputs.server_guards == 'true'
        working-directory: apps/server
        run: pnpm exec vitest run ${{ needs.changes.outputs.server_guard_files }}
      # Alert rules and dashboard vs the metric declarations (grafana/README.md).
      - if: needs.changes.outputs.grafana == 'true'
        run: pnpm test:grafana
      # release-please config vs the workspace packages and their versions (docs/operations.md).
      - if: needs.changes.outputs.release == 'true'
        run: pnpm test:release
      - if: needs.changes.outputs.any == 'true'
        # --if-present: only the apps have a build script, and the scope may hold none of them.
        run: pnpm $FILTERS run --if-present build

  # One job per section, in parallel. Each job has its own Postgres and Redis, so the
  # sections cannot truncate each other. The wall-clock lane is the files that wait on
  # real timers (apps/server/vitest.config.integration.ts). Inside a job the files run in
  # parallel, one database and Redis db per worker, as many workers as the runner has
  # cores up to 4 (tooling/test-env.ts).
  #
  # Three named jobs, not a matrix: a lane out of scope is skipped and starts no runner, and a
  # skipped matrix would report one check under its unexpanded name, leaving a required
  # "Integration (db)" check waiting. The first job holds the services and steps (YAML anchors);
  # the other two reuse them with their own PACKAGE_DIR and INTEGRATION_LANE. When the scope job
  # failed, every lane runs and fails at its first step.
  integration-db:
    name: Integration (db)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.integration || '{}').db) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PACKAGE_DIR: packages/db
      INTEGRATION_LANE: ''
    services: &integration-services
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magick_agency_test
          POSTGRES_USER: magick_agency
          POSTGRES_PASSWORD: magick_agency_password
        # Same ports as local dev so the suites' port guards hold in CI too.
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U magick_agency -d magick_agency_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6383:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 10
    steps: &integration-steps
      - if: needs.changes.result != 'success'
        run: echo "::error::The CI scope job did not succeed, so this lane cannot be skipped as out of scope." && exit 1
      # As docker/docker-compose.dev.yml: integration files run four at a time and peaked at 96
      # of Postgres's default 100 connections. A service container takes no command, so the
      # setting is written and the container restarted.
      - timeout-minutes: 2
        run: |
          PG=${{ job.services.postgres.id }}
          docker exec "$PG" psql -U magick_agency -d magick_agency_test -qc "ALTER SYSTEM SET max_connections = 300"
          docker restart "$PG"
          until docker exec "$PG" pg_isready -q -U magick_agency -d magick_agency_test; do sleep 1; done
          docker exec "$PG" psql -U magick_agency -d magick_agency_test -tAc "SHOW max_connections"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Real decoders for the server's recording uploads
      # (test/integration/api/inbound-clips-routes.test.ts decodes a real WAV).
      # Cached as .deb files per runner image: a hit installs them with dpkg and never reaches the
      # package mirror (a stalled mirror once held this step for 16 minutes before failing).
      # Nothing to do when the image already has them. Saved straight after the install, so a
      # job that fails later still keeps them; a set dpkg refuses falls back to apt-get.
      - if: env.PACKAGE_DIR == 'apps/server'
        id: apt
        run: |
          if dpkg -s mpg123 sndfile-programs >/dev/null 2>&1; then echo "installed=true" >> "$GITHUB_OUTPUT"; fi
          echo "key=apt-audio-$ImageOS-$ImageVersion-v1" >> "$GITHUB_OUTPUT"
      - if: env.PACKAGE_DIR == 'apps/server' && steps.apt.outputs.installed != 'true'
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}
      - if: env.PACKAGE_DIR == 'apps/server' && steps.apt.outputs.installed != 'true'
        timeout-minutes: 5
        run: |
          DEBS="$HOME/apt-debs"; PKGS="mpg123 sndfile-programs"
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != 'true' ]; then
            sudo mkdir -p "$DEBS/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$DEBS" $PKGS
            # apt's root-only lock would stop the cache from saving the directory.
            sudo rm -rf "$DEBS/partial" "$DEBS/lock" && sudo chown -R "$(id -u):$(id -g)" "$DEBS"
          fi
          sudo dpkg -i "$DEBS"/*.deb || { sudo apt-get update && sudo apt-get install -y --fix-broken --no-install-recommends $PKGS; }
      - if: env.PACKAGE_DIR == 'apps/server' && steps.apt.outputs.installed != 'true' && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt.outputs.key }}
      - run: pnpm install --frozen-lockfile
      # From inside the package directory: dotenv resolves from cwd. INTEGRATION_LANE (job env)
      # picks the server's lane.
      - run: pnpm test:integration
        working-directory: ${{ env.PACKAGE_DIR }}

  integration-server:
    name: Integration (server)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.integration || '{}').server) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PACKAGE_DIR: apps/server
      INTEGRATION_LANE: rest
    services: *integration-services
    steps: *integration-steps

  integration-server-wall-clock:
    name: Integration (server wall-clock)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.integration || '{}').server) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PACKAGE_DIR: apps/server
      INTEGRATION_LANE: wall-clock
    services: *integration-services
    steps: *integration-steps
