name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint = tsc --noEmit over src AND test in every package (tests are typechecked).
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (Postgres 16 + Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magick_agency_test
          POSTGRES_USER: magick_agency
          POSTGRES_PASSWORD: magick_agency_password
        # Same ports as local dev so the suites' port guards hold in CI too.
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U magick_agency -d magick_agency_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6383:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
