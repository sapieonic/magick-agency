name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Real decoders for apps/server/test/unit/audio/decode.test.ts, which fails
      # (rather than skips) under CI when they are missing.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpg123 sndfile-programs
      - run: pnpm install --frozen-lockfile
      # lint = tsc --noEmit over src AND test in every package (tests are typechecked).
      - run: pnpm lint
      - run: pnpm test
      # Alert rules and dashboard vs the metric declarations (grafana/README.md).
      - run: pnpm test:grafana
      - run: pnpm build

  # One job per section, in parallel. Each job has its own Postgres and Redis, so the
  # sections cannot truncate each other. The wall-clock lane is the two files that wait
  # on real Redis TTLs (apps/server/vitest.config.integration.ts).
  integration:
    name: Integration (${{ matrix.section }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: db
            dir: packages/db
            lane: ''
          - section: server
            dir: apps/server
            lane: rest
          - section: server wall-clock
            dir: apps/server
            lane: wall-clock
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: magick_agency_test
          POSTGRES_USER: magick_agency
          POSTGRES_PASSWORD: magick_agency_password
        # Same ports as local dev so the suites' port guards hold in CI too.
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U magick_agency -d magick_agency_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6383:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # From inside the package directory: dotenv resolves from cwd.
      - run: pnpm test:integration
        working-directory: ${{ matrix.dir }}
        env:
          INTEGRATION_LANE: ${{ matrix.lane }}
