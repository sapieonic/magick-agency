name: PR title

# PRs are squash-merged and the PR title becomes the commit on main, which is what
# release-please reads to pick each component's next version and changelog entry
# (docs/operations.md "Releases and versioning", B24). A title that is not a
# Conventional Commit releases nothing and leaves the change out of every changelog.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|deps|docs|refactor|test|build|ci|chore|style)(\([a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*\))?!?: [^ ]'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
            exit 0
          fi
          {
            echo "::error title=PR title is not a Conventional Commit::Got: $TITLE"
            echo 'Expected: <type>(<optional scope>)<optional !>: <summary>, for example'
            echo '  feat(console): show the campaign pacing ratio'
            echo '  fix(server)!: refuse dials without a caller ID'
            echo 'Types: feat, fix, perf, revert, deps (released); docs, refactor, test, build, ci, chore, style (no release).'
          } >&2
          exit 1
