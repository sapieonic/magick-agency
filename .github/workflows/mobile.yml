name: Mobile

# The agent app (apps/mobile, Flutter). Path-filtered: a server-only change does not pay for it.
# packages/contracts is in the filter because the app's wire types are checked against its
# fixtures and literal unions (packages/contracts/fixtures/agent, tooling/contracts-literals.mjs).
on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - tooling/contracts-literals.mjs
      - .github/workflows/mobile.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - tooling/contracts-literals.mjs
      - .github/workflows/mobile.yml

env:
  # One pinned SDK for CI and every developer (apps/mobile/README.md).
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze-test:
    name: Analyze, test, contract drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The TS string-literal unions the app switches on, regenerated and compared.
      - run: node tooling/contracts-literals.mjs --check
        working-directory: .
      - run: flutter analyze
      - run: flutter test
      - run: dart test
        working-directory: apps/mobile/packages/agency_wire
      - run: flutter test
        working-directory: apps/mobile/packages/agent_audio

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Store build numbers come from the CI run, never from pubspec.yaml (release-please owns that).
      - run: >-
          flutter build apk --debug --flavor dev
          --dart-define-from-file=env/dev.json
          --build-number=${{ github.run_number }}

  ios:
    name: iOS build (no signing)
    # macOS runners are expensive: main only. Pull requests get the Android build.
    if: github.event_name == 'push'
    runs-on: macos-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --debug --no-codesign
          --dart-define-from-file=env/dev.json
          --build-number=${{ github.run_number }}
