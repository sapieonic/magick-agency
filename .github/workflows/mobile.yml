name: Mobile

# The agent app (apps/mobile, Flutter). Scoped: a server-only change does not pay for it.
# A pull request, or a push to main, runs analyze and tests when it touches the app or what the
# app's wire types are checked against (MOBILE_PREFIXES in tooling/ci-scope.mjs:
# packages/contracts and its fixtures, the literal extractor tooling/contracts-literals.mjs, and
# packages/domain/src/customer-search-number.ts, which agency_wire's customer_search_number.dart
# ports, held to the same table, docs/customer-history.md). Prose and release-please's version
# bump do not count. The builds run only when what they compile beyond Dart changes
# (ANDROID_INPUTS and IOS_INPUTS: the native projects, the pubspecs and lockfile, env/, this
# file): the debug Android build and its Kotlin tests on a pull request, the release Android
# build on main, the iOS build (macOS, the costly runner) on main and by hand only.
#
# The `full-ci` label runs every pull request job; a manual run runs every job; the weekly
# scheduled run runs every job but iOS. The pull request trigger has no path filter because a
# path filter cannot be lifted by a label; the scope job decides, and the jobs it skips report as
# skipped under their own names. Pushes to main keep the path filter. Adding any label starts a
# new run (only `full-ci` widens it); see ci.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/contracts/**
      - tooling/contracts-literals.mjs
      - packages/domain/src/customer-search-number.ts
      - .github/workflows/mobile.yml
  workflow_dispatch:
  # Every job but iOS, once a week (Monday 03:47 UTC): main runs only what each push changes.
  schedule:
    - cron: '47 3 * * 1'

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One pinned SDK for CI and every developer (apps/mobile/README.md). mobile-release.yml reads
  # it from here (keep it on its own line, `FLUTTER_VERSION: X.Y.Z`).
  FLUTTER_VERSION: 3.47.7

jobs:
  changes:
    name: Mobile scope
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pick the scope
        id: scope
        env:
          FULL: >-
            ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
            || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # A pull request diffs against its merge base; a push to main against the main commit
          # before it.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$FULL" = "true" ]; then
            node tooling/ci-scope.mjs --full
          else
            node tooling/ci-scope.mjs --base "$BASE" --head HEAD
          fi

  analyze-test:
    name: Analyze, test, contract drift
    needs: changes
    # Runs (and fails) when the scope job failed: a skipped job would read as passing.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - if: needs.changes.result != 'success'
        run: echo "::error::The Mobile scope job did not succeed." && exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The TS string-literal unions the app switches on, regenerated and compared.
      - run: node tooling/contracts-literals.mjs --check
        working-directory: .
      - run: flutter analyze
      - run: flutter test
      - run: dart test
        working-directory: apps/mobile/packages/agency_wire
      - run: flutter test
        working-directory: apps/mobile/packages/agent_audio

  # Pull requests (and manual and scheduled runs): main builds the release variant below instead,
  # on the change the pull request already built.
  android:
    name: Android build
    if: github.event_name != 'push' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [changes, analyze-test]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The app compiles against API 37 (permission_handler_android requires it). The SDK
      # installs that platform as `android-37.0`, which AGP 9.1 looks up as `android-37`:
      # install it, then give it the name AGP asks for.
      - name: Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          [ -e "$ANDROID_HOME/platforms/android-37" ] || ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
      # Store build numbers come from the CI run, never from pubspec.yaml (release-please owns that).
      - run: >-
          flutter build apk --debug --flavor dev
          --dart-define-from-file=env/dev.json
          --build-number=${{ github.run_number }}
      # agent_audio's Kotlin unit tests (pure JVM: A-law, the decimator, the jitter buffer and
      # its Dart trace, ringback, the inbound chime, framing, focus recovery, the phone-call
      # tracker). The build above wrote gradlew and local.properties; the plugin is the app's
      # `:agent_audio` project.
      - name: agent_audio Kotlin unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :agent_audio:testDebugUnitTest --no-daemon
      # The app's own Kotlin unit tests (pure JVM: Mode B's ring state machine, the ring push
      # parser, the ring routes' request builders, the copy and checklist rules).
      - name: App Kotlin unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDevDebugUnitTest --no-daemon

  # The release build mobile-release.yml publishes (R8 minify and resource shrinking), compiled on
  # main before a release is tagged, so a shrinker problem is found while it can still be fixed in
  # the release. Debug-signed on purpose and not kept: only the compile is checked. Not on pull
  # requests, as it adds a full build. The placeholder env is enough to compile.
  android-release:
    name: Android release build (staging, debug-signed)
    if: github.event_name != 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [changes, analyze-test]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
          [ -e "$ANDROID_HOME/platforms/android-37" ] || ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
      - run: >-
          flutter build apk --release --flavor staging
          --dart-define-from-file=env/staging.json
          --build-number=${{ github.run_number }}
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: 'true'

  ios:
    name: iOS build (no signing)
    # macOS minutes cost about ten Linux minutes: on main when the iOS inputs change, and by hand
    # (Actions, Mobile, "Run workflow"). Not on pull requests or the weekly run.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [changes, analyze-test]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build ios --debug --no-codesign
          --dart-define-from-file=env/dev.json
          --build-number=${{ github.run_number }}
