name: magick_agency_agent
description: "Magick Agency agent app: Android and iOS, one codebase."
publish_to: 'none'
# Owned by release-please (component "mobile"); store build numbers come from CI.
version: 0.3.0+4

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

# Dart pub workspace: the app and its two in-repo packages resolve together.
workspace:
  - packages/agency_wire
  - packages/agent_audio

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  agency_wire: any
  agent_audio: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  http: ^1.6.0
  # Held on the Firebase iOS SDK 12 line (firebase_core 4.x, firebase_auth 6.x). SDK 13
  # (firebase_core 5 / firebase_auth 7) needs gtm-session-fetcher >=4, and google_sign_in_ios
  # pins GoogleSignIn-iOS 9, which needs gtm-session-fetcher <4: the iOS Swift packages do not
  # resolve. Move both up together once a google_sign_in_ios release takes GoogleSignIn-iOS
  # >=10.1 (docs/mobile.md, "Builds and releases", "iOS dependency pin").
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.1
  wakelock_plus: ^1.8.0
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  battery_plus: ^7.1.2
  intl: ^0.20.3
  collection: ^1.19.1
  meta: ^1.19.0
  posthog_flutter: ^5.58.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
  # Bundled, not fetched at run time: no network at first paint, no layout shift.
  # All three families are SIL Open Font License 1.1 (assets/fonts/README.md).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
