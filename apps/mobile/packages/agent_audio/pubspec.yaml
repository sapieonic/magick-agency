name: agent_audio
description: Native voice audio for the agent app (capture, playback, echo cancellation, routes, call system).
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.magickagency.agent_audio
        pluginClass: AgentAudioPlugin
      ios:
        pluginClass: AgentAudioPlugin
