# NEW (magick-agency): the one reverse proxy in front of the server, and the
# static host for both UIs. docker/web.Dockerfile installs it as
# /etc/nginx/conf.d/default.conf.
#
# DEPLOYMENT INVARIANT: this nginx is the server's ONLY way in, and it is ONE hop
# (TRUST_PROXY_HOPS=1). It appends the address it saw to X-Forwarded-For; the
# server trusts exactly that many entries from the right, and that entry keys
# every IP rate-limit bucket. If a load balancer or TLS terminator sits in front
# of this nginx, that is a second hop: set TRUST_PROXY_HOPS=2.

upstream magick_agency_server {
    server server:3021;
    keepalive 16;
}

# WebSocket upgrades pass through; other requests reuse upstream keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
server_tokens off;

# ── Console (agents, supervisors, admins) and the carrier ─────────────
server {
    listen 8080;
    root /usr/share/nginx/console;

    # The roster CSV upload streams up to 512 MiB (CSV_MAX_BYTES in
    # proxy-agency-campaigns.routes.ts) plus multipart framing.
    client_max_body_size 513m;

    # Every top-level path the console calls on the server: the dev proxy's
    # API_PREFIXES (apps/console/vite.config.ts), kept in step by
    # apps/server/test/unit/deploy/nginx-conf.test.ts. `/api` is the carrier's
    # surface (VoiceLink status webhooks, the PSTN media socket, recording
    # playback), so VOICELINK_WEBHOOK_BASE_URL is this server's public origin.
    location ~ ^/(auth|accounts|tenants|users|invites|notifications|feature-flags|proxy|dnc|phone-numbers|api)(/|$) {
        proxy_pass http://magick_agency_server;
        proxy_request_buffering off;
        # The station socket and the PSTN media socket live for a whole shift
        # and a whole call respectively.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://magick_agency_server;
    }

    # Hashed bundles never change under a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ── Super-admin ───────────────────────────────────────────────────────
# Publish this port to a private interface or VPN only
# (docker/docker-compose.prod.yml binds it to 127.0.0.1).
server {
    listen 8081;
    root /usr/share/nginx/super-admin;

    # The super-admin UI's routes sit at the root, so the API prefix cannot
    # collide with a page reload (apps/super-admin/vite.config.ts).
    location /super-admin/ {
        proxy_pass http://magick_agency_server;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
