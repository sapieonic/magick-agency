# The reverse proxy in front of the server, and the static host for both UIs.
# docker/web.Dockerfile installs it as /etc/nginx/conf.d/default.conf.
#
# DEPLOYMENT INVARIANT, proxy hops (docs/operations.md "What nginx serves"): the
# server trusts exactly TRUST_PROXY_HOPS X-Forwarded-For entries from the right,
# and the one it lands on keys every IP rate-limit bucket.
#   - :8080 sits behind your TLS terminator (mandatory: browsers and the carrier
#     need https/wss) and APPENDS the address it saw, so the chain is
#     client -> TLS terminator -> nginx -> server: TRUST_PROXY_HOPS=2. It must be
#     reachable ONLY from that terminator (the compose file binds it to 127.0.0.1).
#   - :8081 is reached directly (SSH tunnel / VPN), so it OVERWRITES the header
#     with the address it saw: a client-sent X-Forwarded-For never reaches the
#     server, which then keys on that address for any TRUST_PROXY_HOPS >= 1.

# Docker's embedded DNS. `server` is re-resolved while nginx runs (`resolve`
# below), so a recreated server container with a new address is followed.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream magick_agency_server {
    zone magick_agency_server 64k;
    server server:3021 resolve;
    keepalive 16;
}

# WebSocket upgrades pass through; other requests reuse upstream keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The TLS terminator's scheme when it sent one, else this hop's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

proxy_http_version 1.1;
server_tokens off;

gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# ── Console (agents, supervisors, admins) and the carrier ─────────────
server {
    listen 8080;
    root /usr/share/nginx/console;

    # Appends: one hop after the TLS terminator (TRUST_PROXY_HOPS=2).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The roster CSV upload streams up to 512 MiB (CSV_MAX_BYTES in
    # proxy-agency-campaigns.routes.ts) plus multipart framing.
    client_max_body_size 513m;

    # Every top-level path the console calls on the server: the dev proxy's
    # API_PREFIXES (apps/console/vite.config.ts), kept in step by
    # apps/server/test/unit/deploy/production-packaging.test.ts. `/api` is the
    # carrier's surface (VoiceLink status webhooks, the PSTN media socket,
    # recording playback), so VOICELINK_WEBHOOK_BASE_URL is this server's public
    # origin.
    location ~ ^/(auth|accounts|tenants|users|invites|notifications|feature-flags|proxy|dnc|phone-numbers|api)(/|$) {
        proxy_pass http://magick_agency_server;
        proxy_request_buffering off;
        # The station socket and the PSTN media socket live for a whole shift
        # and a whole call respectively.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Probes, for the TLS terminator's / load balancer's health check.
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://magick_agency_server;
    }

    # Hashed bundles never change under a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ── Super-admin ───────────────────────────────────────────────────────
# Publish this port to a private interface or VPN only
# (docker/docker-compose.prod.yml binds it to 127.0.0.1).
server {
    listen 8081;
    root /usr/share/nginx/super-admin;

    # Overwrites: nothing a client sends survives, so `POST /super-admin/login`'s
    # 5/min bucket keys on the real peer whatever TRUST_PROXY_HOPS is.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The super-admin UI's routes sit at the root, so the API prefix cannot
    # collide with a page reload (apps/super-admin/vite.config.ts).
    location /super-admin/ {
        proxy_pass http://magick_agency_server;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
