# Dev AND test infrastructure for magick-agency, on ports reserved for it
# (decision B3). Never point anything here at 5432/5433/5434/6379/6380/6381:
# other local stacks use them, and a test suite pointed at the wrong Redis can
# flush another stack's data.
#
#   Postgres 5436 — databases `magick_agency` (dev) and `magick_agency_test`
#   Redis    6383 — db 0 dev, db 1 test (only db 1 is ever flushed, by tests)
#
#   pnpm infra:up     start and wait for health
#   pnpm infra:reset  drop the volume
name: magick-agency

services:
  postgres:
    image: postgres:16-alpine
    container_name: magick-agency-postgres
    environment:
      POSTGRES_DB: magick_agency
      POSTGRES_USER: magick_agency
      POSTGRES_PASSWORD: magick_agency_password
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magick_agency -d magick_agency_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: magick-agency-redis
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
