# Production stack for magick-agency: the server, nginx (both UIs + the reverse
# proxy) and Redis. Postgres is NOT here: NODE_ENV=production turns Postgres TLS
# on and verifies the certificate, so point DATABASE_URL at a managed /
# TLS-enabled database (docs/operations.md, "Postgres TLS").
#
#   cp docker/.env.example docker/.env      # fill it in (git-ignored)
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# docker/.env is read twice, both automatically: compose loads it from this
# directory for the ${...} values below (web build args, published ports), and
# `env_file` hands it to the server as its environment.
#
# DEPLOYMENT INVARIANTS (docs/operations.md "Deployment invariants"):
#   1. ONE replica of `server`. Never `--scale server=N` or `deploy.replicas`:
#      the agency runtime, the bridge's unstored-token memo and every sweep
#      assume one process (D2).
#   2. `server` is reachable ONLY through nginx: it publishes no port. nginx :8080
#      is reachable ONLY from your TLS terminator (bound to 127.0.0.1 by default),
#      so the chain is exactly TRUST_PROXY_HOPS=2 proxies (docker/.env.example).
#   3. NODE_ENV=production: Postgres TLS on and verified (Node's roots, or
#      DB_SSL_CA, the PEM text of a private CA). DB_SSL_REJECT_UNAUTHORIZED=false
#      is the only opt-out. No TLS parameters in DATABASE_URL (refused at boot).
#   4. Redis persists (AOF here) and never evicts (`noeviction`): a call token
#      lost early is refused and cuts the live call (Q6).
#   5. stop_grace_period 45s: shutdown closes HTTP, then drains in-flight
#      campaign-completion emails for up to 30s; Docker's default is 10s.
#   6. Migrations run before the server starts, on every start (entrypoint.sh).
#
# The project name is NOT the dev stack's (`magick-agency`, docker-compose.dev.yml):
# sharing it would let `pnpm infra:up` / `infra:reset` recreate or remove this
# Redis with the dev settings (no AOF, no noeviction, no volume).
name: magick-agency-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: magick-agency-server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3021"
      REDIS_URL: redis://redis:6379/0
    # No `ports:` on purpose (invariant 2).
    expose:
      - "3021"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3021/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Migrations run first; the first boot on an empty database applies the baseline.
      start_period: 120s
    stop_grace_period: 45s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_BRAND: ${VITE_BRAND:-magick-agency}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_POSTHOG_ENVIRONMENT: ${VITE_POSTHOG_ENVIRONMENT:-production}
    image: magick-agency-web
    ports:
      # Console + carrier webhooks/media, for the TLS terminator only (invariant 2).
      # A terminator on another machine: bind a private interface and firewall it.
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080"
      # Super-admin: loopback by default; reach it over SSH / VPN.
      - "${SUPER_ADMIN_BIND:-127.0.0.1}:${SUPER_ADMIN_PORT:-8081}:8081"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # AOF persistence (fsync every second) and no eviction (invariant 4). No
    # maxmemory is set, so Redis grows rather than evicts; size the host for it.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  redisdata:
